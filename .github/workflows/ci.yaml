name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Windows real-window smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: macOS real-window smoke test
        if: matrix.os == 'macos-latest'
        run: bash ./scripts/smoke-darwin.sh