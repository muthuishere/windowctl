version: '3'

# Top-level orchestration. All Go targets cd into ./src so the module rooted
# there is the build target.

tasks:
  build:
    desc: Build the CLI binary for the current platform
    dir: src
    cmds:
      - go build -o ../bin/windowctl ./cmd/windowctl

  test:
    desc: Run all tests
    dir: src
    cmds:
      - go test ./...

  lint:
    desc: Run go vet across the module
    dir: src
    cmds:
      - go vet ./...

  snapshot:
    desc: Build a snapshot release for all platforms (requires goreleaser)
    dir: src
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Publish a release via GoReleaser
    dir: src
    cmds:
      - goreleaser release --clean
